<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#F15A24"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | SSM IET</title><link rel="icon" href="assets/images/ssmiet-logo.png"><link rel="stylesheet" href="assets/css/style.css"></head>
<body data-page="admin-login" >
<header id="h"></header>
<main id="m" class="wrap">
<div class="card" style="max-width:440px;margin:2.5rem auto;text-align:center">
<h1>Admin Login</h1>
<p style="color:var(--t-muted);margin-bottom:1.5rem">SSM IET Admissions Staff Portal</p>
<div id="login-actions">
<button type="button" class="btn" id="cognito-btn" style="width:100%;margin-bottom:0.75rem">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
Sign In with AWS Cognito
</button>
<p class="hint" style="margin:0.25rem 0 0.75rem;font-size:0.86rem">Secured with OAuth 2.0 PKCE Authorization</p>
</div>
<div id="auth-status" aria-live="polite" style="margin-top:0.75rem"></div>
<p class="err" id="er" role="alert" style="margin-top:0.5rem"></p>
<form id="lf" hidden style="margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--l);text-align:left">
<p style="font-size:0.82rem;font-weight:700;color:var(--t-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.75rem">Mock Mode Sign In</p>
<label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><button class="btn sm ghost" style="margin-top:0.75rem">Sign In (Mock)</button>
</form>
</div>
</main>
<footer id="f"></footer>
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
</body></html>
